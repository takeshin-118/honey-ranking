<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>参加者編集 | ハニーポイント</title>

  <style>
    :root {
      --honey: #ffcc33;
      --honey-deep: #f59e0b;
      --cream: #fffaf0;
      --brown: #6b3f1f;
      --brown-dark: #3f2818;
      --line: #ead9be;
      --danger: #d94841;
      --success: #2f7d32;
      --shadow: 0 12px 30px rgba(74, 44, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        system-ui,
        -apple-system,
        sans-serif;

      color: var(--brown-dark);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 204, 51, 0.18) 0 70px,
          transparent 72px
        ),
        radial-gradient(
          circle at 88% 15%,
          rgba(245, 158, 11, 0.14) 0 110px,
          transparent 112px
        ),
        var(--cream);

      min-height: 100vh;
    }

    .wrap {
      width: min(980px, calc(100% - 28px));
      margin: auto;
      padding: 28px 0 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: var(--brown);
      font-size: clamp(27px, 5vw, 42px);
    }

    .sub {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.7;
      font-weight: 700;
    }

    .back {
      text-decoration: none;
      color: var(--brown);
      font-weight: 900;
      background: #ffffff;
      border: 2px solid var(--brown);
      border-radius: 14px;
      padding: 10px 14px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 16px;
      color: var(--brown);
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 6px;
      color: #6f5138;
    }

    input {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 13px;
      padding: 12px 13px;
      font: inherit;
      font-size: 16px;
      outline: none;
      background: #fffdf8;
    }

    input:focus {
      border-color: var(--honey-deep);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.13);
    }

    .primary {
      width: 100%;
      border: 2px solid var(--brown);
      border-radius: 14px;
      padding: 13px;
      font: inherit;
      font-weight: 1000;
      background: var(--honey);
      color: var(--brown-dark);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--honey-deep);
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      width: 100%;
      margin-top: 9px;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 11px;
      font: inherit;
      font-weight: 900;
      background: #ffffff;
      color: var(--brown);
      cursor: pointer;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
      word-break: break-word;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .person {
      border: 1.5px solid var(--line);
      border-radius: 17px;
      padding: 13px;
      background: #fffdf9;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .person-name {
      font-weight: 1000;
      font-size: 17px;
    }

    .mini {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 4px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .btn {
      border: 1.5px solid var(--line);
      background: #ffffff;
      border-radius: 11px;
      padding: 8px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .delete {
      color: var(--danger);
      border-color: #f0c2bf;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 28px;
      border: 2px dashed var(--line);
      border-radius: 16px;
      color: #8b6a4d;
    }

    .helper {
      margin-top: 14px;
      padding: 12px 13px;
      background: #fff7d6;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .back {
        align-self: flex-start;
      }

      .person {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="topbar">

      <div>
        <h1>
          🍯 参加者・得点編集
        </h1>

        <div class="sub">
          Cloudflare D1 に保存
        </div>
      </div>

      <a
        class="back"
        href="../"
      >
        ← ランキングへ戻る
      </a>

    </div>


    <div class="grid">

      <section class="card">

        <h2 id="formTitle">
          参加者を追加
        </h2>


        <form id="playerForm">

          <input
            type="hidden"
            id="editId"
          >


          <div class="field">

            <label for="name">
              名前
            </label>

            <input
              id="name"
              maxlength="30"
              placeholder="例：たけしん"
              required
            >

          </div>


          <div class="field">

            <label for="mole">
              モグラ叩き
            </label>

            <input
              id="mole"
              type="number"
              min="0"
              step="1"
              value="0"
              required
            >

          </div>


          <div class="field">

            <label for="drop">
              ハニードロップ
            </label>

            <input
              id="drop"
              type="number"
              min="0"
              step="1"
              value="0"
              required
            >

          </div>


          <div class="field">

            <label for="bowling">
              ボーリング
            </label>

            <input
              id="bowling"
              type="number"
              min="0"
              step="1"
              value="0"
              required
            >

          </div>


          <button
            class="primary"
            type="submit"
            id="submitBtn"
          >
            ＋ 追加する
          </button>


          <button
            class="secondary"
            type="button"
            id="cancelBtn"
            hidden
          >
            編集をキャンセル
          </button>


          <div
            class="message"
            id="message"
          ></div>

        </form>


        <div class="helper">
          データは Cloudflare D1 に保存されます。
          <br>
          保存に失敗した場合は、エラー内容をこの画面に表示します。
        </div>

      </section>



      <section class="card">

        <h2>
          現在の参加者
          <span id="count"></span>
        </h2>


        <div
          class="list"
          id="playerList"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </section>

    </div>

  </main>


  <script>

    let players = [];


    function escapeHtml(str) {

      return String(str)
        .replace(
          /[&<>"']/g,
          char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[char])
        );

    }


    function scoreValue(id) {

      const value =
        Number(
          document
            .getElementById(id)
            .value
        );


      if (
        Number.isFinite(value)
        &&
        value >= 0
      ) {
        return Math.floor(value);
      }


      return 0;

    }


    function showMessage(
      text,
      error = false
    ) {

      const el =
        document.getElementById(
          "message"
        );


      el.textContent =
        text;


      el.style.color =
        error
          ? "#d94841"
          : "#2f7d32";

    }


    async function getErrorMessage(
      response
    ) {

      try {

        const data =
          await response.json();


        if (data.error) {

          if (data.detail) {
            return (
              data.error +
              " / " +
              data.detail
            );
          }

          return data.error;

        }


        return JSON.stringify(data);

      }

      catch {

        try {

          return await response.text();

        }

        catch {

          return (
            "HTTP " +
            response.status
          );

        }

      }

    }


    async function loadPlayers() {

      const list =
        document.getElementById(
          "playerList"
        );


      list.innerHTML =
        '<div class="loading">読み込み中...</div>';


      try {

        const response =
          await fetch(
            "../api/players",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          const detail =
            await getErrorMessage(
              response
            );


          throw new Error(
            "読み込み失敗：" +
            detail
          );

        }


        players =
          await response.json();


        renderList();

      }

      catch (error) {

        console.error(error);


        list.innerHTML =
          '<div class="empty">データを読み込めませんでした。</div>';


        showMessage(
          error.message,
          true
        );

      }

    }


    function renderList() {

      const list =
        document.getElementById(
          "playerList"
        );


      document
        .getElementById(
          "count"
        )
        .textContent =
          `(${players.length}人)`;


      list.innerHTML =
        "";


      if (
        players.length === 0
      ) {

        list.innerHTML =
          '<div class="empty">まだ参加者がいません。</div>';

        return;

      }


      players.forEach(
        player => {

          const total =
            Number(player.mole)
            +
            Number(player.honey_drop)
            +
            Number(player.bowling);


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "person";


          div.innerHTML = `

            <div>

              <div
                class="person-name"
              >
                ${escapeHtml(
                  player.name
                )}
              </div>


              <div class="mini">

                モグラ
                ${player.mole}点

                ／

                ハニー
                ${player.honey_drop}点

                ／

                ボーリング
                ${player.bowling}点

                <br>

                総合
                ${total}点

              </div>

            </div>


            <div class="actions">

              <button
                class="btn"
                data-edit="${player.id}"
              >
                編集
              </button>


              <button
                class="btn delete"
                data-delete="${player.id}"
              >
                削除
              </button>

            </div>

          `;


          list.appendChild(
            div
          );

        }
      );


      document
        .querySelectorAll(
          "[data-edit]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                startEdit(
                  Number(
                    button.dataset.edit
                  )
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          "[data-delete]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                removePlayer(
                  Number(
                    button.dataset.delete
                  )
                );

              }
            );

          }
        );

    }


    function resetForm() {

      document
        .getElementById(
          "playerForm"
        )
        .reset();


      document
        .getElementById(
          "editId"
        )
        .value =
          "";


      document
        .getElementById(
          "mole"
        )
        .value =
          0;


      document
        .getElementById(
          "drop"
        )
        .value =
          0;


      document
        .getElementById(
          "bowling"
        )
        .value =
          0;


      document
        .getElementById(
          "formTitle"
        )
        .textContent =
          "参加者を追加";


      document
        .getElementById(
          "submitBtn"
        )
        .textContent =
          "＋ 追加する";


      document
        .getElementById(
          "cancelBtn"
        )
        .hidden =
          true;

    }


    function startEdit(id) {

      const player =
        players.find(
          player =>
            Number(player.id)
            ===
            Number(id)
        );


      if (!player) {
        return;
      }


      document
        .getElementById(
          "editId"
        )
        .value =
          player.id;


      document
        .getElementById(
          "name"
        )
        .value =
          player.name;


      document
        .getElementById(
          "mole"
        )
        .value =
          player.mole;


      document
        .getElementById(
          "drop"
        )
        .value =
          player.honey_drop;


      document
        .getElementById(
          "bowling"
        )
        .value =
          player.bowling;


      document
        .getElementById(
          "formTitle"
        )
        .textContent =
          "参加者を編集";


      document
        .getElementById(
          "submitBtn"
        )
        .textContent =
          "✓ 更新する";


      document
        .getElementById(
          "cancelBtn"
        )
        .hidden =
          false;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    async function removePlayer(id) {

      const player =
        players.find(
          player =>
            Number(player.id)
            ===
            Number(id)
        );


      if (!player) {
        return;
      }


      const ok =
        confirm(
          `「${player.name}」を削除しますか？`
        );


      if (!ok) {
        return;
      }


      try {

        const response =
          await fetch(

            `../api/players?id=${encodeURIComponent(id)}`,

            {
              method:
                "DELETE"
            }

          );


        if (!response.ok) {

          const detail =
            await getErrorMessage(
              response
            );


          throw new Error(
            "削除失敗：" +
            detail
          );

        }


        showMessage(
          "削除しました。"
        );


        await loadPlayers();

      }

      catch (error) {

        console.error(error);


        showMessage(
          error.message,
          true
        );

      }

    }


    document
      .getElementById(
        "playerForm"
      )
      .addEventListener(

        "submit",

        async event => {

          event.preventDefault();


          const submitButton =
            document.getElementById(
              "submitBtn"
            );


          const name =
            document
              .getElementById(
                "name"
              )
              .value
              .trim();


          if (!name) {

            showMessage(
              "名前を入力してください。",
              true
            );

            return;

          }


          const editId =
            document
              .getElementById(
                "editId"
              )
              .value;


          const id =
            editId
              ? Number(editId)
              : null;


          const data = {

            name:

              name,

            mole:

              scoreValue(
                "mole"
              ),

            honey_drop:

              scoreValue(
                "drop"
              ),

            bowling:

              scoreValue(
                "bowling"
              )

          };


          submitButton.disabled =
            true;


          submitButton.textContent =
            "保存中...";


          try {

            let response;


            if (id) {

              response =
                await fetch(

                  "../api/players",

                  {

                    method:
                      "PUT",

                    headers: {

                      "Content-Type":
                        "application/json; charset=utf-8"

                    },

                    body:
                      JSON.stringify({
                        id,
                        ...data
                      })

                  }

                );

            }

            else {

              response =
                await fetch(

                  "../api/players",

                  {

                    method:
                      "POST",

                    headers: {

                      "Content-Type":
                        "application/json; charset=utf-8"

                    },

                    body:
                      JSON.stringify(
                        data
                      )

                  }

                );

            }


            if (!response.ok) {

              const detail =
                await getErrorMessage(
                  response
                );


              throw new Error(
                "保存失敗：" +
                detail
              );

            }


            const result =
              await response.json();


            console.log(
              "保存結果:",
              result
            );


            showMessage(

              id
                ? "更新しました。"
                : "追加しました。"

            );


            resetForm();


            await loadPlayers();

          }

          catch (error) {

            console.error(
              error
            );


            showMessage(
              error.message,
              true
            );

          }

          finally {

            submitButton.disabled =
              false;


            if (
              document
                .getElementById(
                  "editId"
                )
                .value
            ) {

              submitButton.textContent =
                "✓ 更新する";

            }

            else {

              submitButton.textContent =
                "＋ 追加する";

            }

          }

        }

      );


    document
      .getElementById(
        "cancelBtn"
      )
      .addEventListener(
        "click",
        resetForm
      );


    loadPlayers();

  </script>

</body>
</html>
